name: CI and Publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run dependency security audit
        run: pnpm audit --audit-level=high

      - name: Check code formatting and linting
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit and contract tests
        env:
          NODE_ENV: test
          LOGTO_ENDPOINT: http://localhost:3001
          LOGTO_APP_ID: chronos-app
          LOGTO_APP_SECRET: chronos-secret-key-at-least-32-chars
          LOGTO_COOKIE_SECRET: complex_password_at_least_32_characters_long_12345
          LOGTO_BASE_URL: http://localhost:3000
          LOGTO_RESOURCE: https://api.school.example/skanida
          LOGTO_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/login
          ASTRA_API_URL: http://localhost:3000
        run: pnpm test

      - name: Checkout canonical Astra contract
        uses: actions/checkout@v4
        with:
          repository: geber-suprabapak/project-astra
          path: .contract-source/project-astra
          sparse-checkout: contracts

      - name: Run empirical settlement tests
        env:
          ASTRA_CONTRACT_PATH: .contract-source/project-astra/contracts/astra-v1.json
          LOGTO_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/login
        run: pnpm test:empirical

      - name: Check Astra contract drift
        env:
          ASTRA_CONTRACT_PATH: .contract-source/project-astra/contracts/astra-v1.json
        run: pnpm contract:check

      - name: Build application
        env:
          SKIP_ENV_VALIDATION: "1"
          NODE_ENV: production
        run: pnpm run build

      - name: Run E2E tests
        env:
          CI: "true"
          RUN_A11Y_TESTS: "1"
          PORT: "3055"
          MOCK_ASTRA_PORT: "23500"
          MOCK_LOGTO_PORT: "23501"
          BASE_URL: http://localhost:3055
          LOGTO_POST_LOGOUT_REDIRECT_URI: http://localhost:3055/login
        run: pnpm test:e2e

      - name: Upload Playwright failure evidence
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  publish:
    needs: verify
    if: needs.verify.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Resolve build metadata
        id: build
        shell: bash
        run: |
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.built_at }}
            APP_VERSION=${{ steps.build.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish immutable image reference
        shell: bash
        run: |
          echo "### Published Chronos image" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
